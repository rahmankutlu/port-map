name: Bug report
description: Report a reproducible problem in Port Map
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Remove network-sensitive data before attaching exports or screenshots.
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open…\n2. Select…\n3. Observe…"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options: [Chrome, Firefox, Safari, Edge, Other]
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
